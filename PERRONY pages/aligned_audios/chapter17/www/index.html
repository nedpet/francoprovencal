<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="application-name" content="read along">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
    <meta name="generator" content="@readalongs/studio (cli) 1.2.2">
    <title>ReadAlong-Studio for Interactive Storytelling</title>
    <!-- Import fonts. Material Icons are needed by the web component -->
    <link href="https://fonts.googleapis.com/css?family=Lato%7CMaterial+Icons%7CMaterial+Icons+Outlined" rel="stylesheet">
  </head>

  <body>
    <!-- Here is how you declare the Web Component. Supported languages: eng, fra, spa -->
    <read-along
      href="chapter17.readalong"
      audio="chapter17.mp3"
      theme="light"
      language="eng"
    >
      <span slot='read-along-header'>Your read-along title goes here</span>
      <span slot='read-along-subheader'>Your read-along subtitle goes here</span>
    </read-along>
  </body>

  <!-- The last step needed is to import the package -->
  <script type="module" src='https://unpkg.com/@readalongs/web-component@^1.5.x/dist/web-component/web-component.esm.js'></script>
</html>
